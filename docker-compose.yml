name: cowrie-honeypot

# Architecture and security model are described in docs/ARCHITECTURE.md
# and docs/SECURITY.md. In short:
#   - cowrie sits on the "honeypot-egress" network (the only one with
#     a real route out, filtered via scripts/firewall.sh) and
#     "internal" (for shipping logs to Loki, no route out).
#   - grafana/session-viewer/session-generator sit on "internal" +
#     "mgmt-publish" (the latter exists only because of the Docker
#     port-publish mechanism, see docs/SECURITY.md -- it gets no
#     firewall exception).

networks:
  honeypot-egress:
    driver: bridge
    ipam:
      config:
        - subnet: ${COWRIE_EGRESS_SUBNET:-172.30.0.0/24}
  internal:
    driver: bridge
    internal: true
  mgmt-publish:
    driver: bridge
    ipam:
      config:
        - subnet: ${MGMT_PUBLISH_SUBNET:-172.31.0.0/24}

services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    restart: unless-stopped
    networks:
      honeypot-egress:
        ipv4_address: ${COWRIE_IP:-172.30.0.10}
      internal: {}
    ports:
      - "${COWRIE_SSH_PORT:-2222}:2222/tcp"
      - "${COWRIE_TELNET_PORT:-2223}:2223/tcp"
    volumes:
      - ./config/cowrie:/cowrie/cowrie-git/etc:ro
      - cowrie-var-log:/cowrie/cowrie-git/var/log
      - cowrie-var-lib:/cowrie/cowrie-git/var/lib
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  promtail:
    image: grafana/promtail:latest
    container_name: cowrie-promtail
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - cowrie-var-log:/cowrie-logs:ro
      # the whole directory (not just the file), so an optional
      # GeoLite2-City.mmdb can be dropped in -- see
      # config/promtail/promtail-config.yml
      - ./config/promtail:/etc/promtail:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
    depends_on:
      - cowrie

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    networks:
      - internal
    environment:
      - LOKI_RETENTION_HOURS=${LOKI_RETENTION_HOURS:-2160}
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - internal
      - mgmt-publish
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/cowrie-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  session-viewer:
    image: nginx:alpine
    container_name: session-viewer
    restart: unless-stopped
    networks:
      - internal
      - mgmt-publish
    ports:
      - "${SESSION_VIEWER_PORT:-8080}:80"
    volumes:
      - ./webui:/usr/share/nginx/html
      - ./config/nginx/session-viewer.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx/htpasswd:/etc/nginx/htpasswd:ro
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M

  session-generator:
    build: ./docker/session-generator
    image: cowrie-honeypot/session-generator:latest
    container_name: session-generator
    restart: unless-stopped
    networks:
      - internal
    environment:
      - GENERATE_INTERVAL=${SESSION_GENERATOR_INTERVAL:-120}
      - SESSION_MIN_FRAME_DELAY=${SESSION_MIN_FRAME_DELAY:-0.05}
    volumes:
      - cowrie-var-log:/data/var/log:ro
      - cowrie-var-lib:/data/var/lib:ro
      - ./webui:/data/webui
    depends_on:
      - cowrie

volumes:
  loki-data:
  grafana-data:
  cowrie-var-log:
  cowrie-var-lib:
