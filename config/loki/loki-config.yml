auth_enabled: false

server:
  http_listen_port: 3100
  # Default gRPC message cap (4MB) is too small for a raw log-line
  # query returning a few thousand lines (Explore does this by
  # default) -- without this, those queries fail internally with
  # "received message larger than max" and just look like a timeout
  # to Grafana. This is all loopback traffic inside one container, so
  # there's no real cost to raising it.
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

# The internal querier<->frontend/scheduler gRPC hop (still present
# even in single-binary mode) has its own message-size limit,
# separate from the server one above -- same failure mode, same fix.
frontend:
  grpc_client_config:
    max_send_msg_size: 104857600
    max_recv_msg_size: 104857600

frontend_worker:
  grpc_client_config:
    max_send_msg_size: 104857600
    max_recv_msg_size: 104857600

query_scheduler:
  grpc_client_config:
    max_send_msg_size: 104857600
    max_recv_msg_size: 104857600

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Value comes from LOKI_RETENTION_HOURS in .env (expanded via
  # -config.expand-env=true, see docker-compose.yml)
  retention_period: ${LOKI_RETENTION_HOURS}h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  # Required for the optional GeoIP map (see promtail-config.yml) --
  # lets Promtail attach lat/lon as per-line structured metadata
  # instead of high-cardinality labels.
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
