server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: cowrie
    static_configs:
      - targets: [localhost]
        labels:
          job: cowrie
          __path__: /cowrie-logs/cowrie/cowrie.json

    pipeline_stages:
      - json:
          expressions:
            eventid: eventid
            src_ip: src_ip
            username: username
            password: password
            input: input
            timestamp: timestamp

      # Optional GeoIP enrichment, purely local from a MaxMind DB (no
      # outbound queries). Requires downloading GeoLite2-City.mmdb
      # (free with registration at maxmind.com) into
      # config/promtail/GeoLite2-City.mmdb. Uncomment once the file
      # is there:
      # - geoip:
      #     db: /etc/promtail/GeoLite2-City.mmdb   # <- put the file here
      #     source: src_ip
      #     db_type: city

      - labels:
          eventid:

      - timestamp:
          source: timestamp
          format: RFC3339
