server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: cowrie
    static_configs:
      - targets: [localhost]
        labels:
          job: cowrie
          __path__: /cowrie-logs/cowrie/cowrie.json

    pipeline_stages:
      - json:
          expressions:
            eventid: eventid
            src_ip: src_ip
            username: username
            password: password
            input: input
            timestamp: timestamp

      # GeoIP enrichment, purely local from a MaxMind-format DB (no
      # outbound queries). See docs/CONFIGURATION.md for where to get
      # a free DB (no account needed via DB-IP, or MaxMind with a
      # free account) -- put it at config/promtail/GeoLite2-City.mmdb.
      #
      # NOTE: lat/lon go in as structured metadata, NOT as labels --
      # they're per-event, high-cardinality values, and Loki labels
      # must stay low-cardinality or ingestion performance falls
      # over. structured_metadata is Loki's mechanism for exactly
      # this: queryable per-line data that isn't part of the index
      # (also needs limits_config.allow_structured_metadata: true in
      # config/loki/loki-config.yml, already set).
      - geoip:
          db: /etc/promtail/GeoLite2-City.mmdb
          source: src_ip
          db_type: city
      - structured_metadata:
          geoip_city_name:
          geoip_country_name:
          geoip_location_latitude:
          geoip_location_longitude:

      - labels:
          eventid:

      - timestamp:
          source: timestamp
          format: RFC3339
