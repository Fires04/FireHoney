server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx listens on port 80 *inside* the container -- Docker maps
    # that to SESSION_VIEWER_PORT (8080 by default) on the host, but
    # nginx has no idea that mapping exists. Without this, its
    # auto-absolute redirects (like the one below) use its own
    # internal port, which is 80 -- the default for http, so nginx
    # omits it entirely, and the redirect silently loses the real
    # port. This keeps our redirects plain relative paths instead, so
    # the browser fills in whatever host:port it actually used.
    absolute_redirect off;

    # Every request is gated by GET /auth-check on the viewer-auth
    # service (see docker/viewer-auth/) -- it checks the signed
    # session cookie and returns 200/401. No credentials or session
    # state live in nginx itself.
    auth_request /auth-check;
    error_page 401 = @needs_login;

    location = /auth-check {
        internal;
        proxy_pass http://viewer-auth:5000/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @needs_login {
        return 302 /login?next=$request_uri;
    }

    # /login and /logout are served by viewer-auth directly, not
    # behind auth_request (that would be a redirect loop for /login).
    location /login {
        auth_request off;
        proxy_pass http://viewer-auth:5000;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /logout {
        auth_request off;
        proxy_pass http://viewer-auth:5000;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
