# Overrides nad vestavěnými Cowrie defaults (cowrie.cfg.dist).
# Cowrie si cowrie.cfg.dist načte sám interně z balíčku -- tenhle
# soubor obsahuje JEN to, co měníme. Plný seznam všech možných
# nastavení: https://github.com/cowrie/cowrie/blob/main/src/cowrie/data/etc/cowrie.cfg.dist
#
# POZOR: musí to být čistě ASCII soubor (i komentáře) -- Cowrie ho
# čte jako `read_text(encoding="ascii")`, jinak SPADNE NAČÍTÁNÍ
# CELÉHO souboru a VŠECHNA přihlášení začnou selhávat (fail-closed).

[honeypot]
# Hostname zobrazený ve fake shellu (`hostname`, `uname -a`, prompt).
# Uprav na cokoliv věrohodného -- generický "svr04" default přitáhne
# jen ty nejlínější skenery.
hostname = webprod03

# KRITICKÉ: nikdy neměnit na "proxy" nebo "llm" backend, který by
# předával příkazy jinam. "shell" = plná emulace, to je bezpečnostní
# hranice celého nasazení.
backend = shell

# Limit velikosti stahovaných "malware" vzorků (Cowrie soubor jen
# stáhne a uloží, nikdy nespustí -- ale i tak omez velikost).
download_limit_size = 26214400

[shell]
# Vlastní filesystem, viz docs/ANTI-DETECTION.md a scripts/build-fakefs.sh.
# POZOR: patří pod [shell], ne pod [honeypot] (snadná záměna).
# Pokud soubor neexistuje (ještě jsi nespustil `make fakefs`), Cowrie
# tiše spadne zpátky na vestavěný generický fs.pickle.
filesystem = etc/fs.pickle

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = false

# Volitelné: sdílení dat do SANS ISC DShield (anonymizovaně).
# Vyžaduje vlastní odchozí výjimku navíc ve firewallu (viz
# docs/SECURITY.md), defaultně vypnuto.
# [output_dshield]
# enabled = false
# userid = <tvoje DShield ID>
# auth_key = <tvuj DShield auth key>
