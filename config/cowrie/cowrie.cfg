# Overrides on top of Cowrie's built-in defaults (cowrie.cfg.dist).
# Cowrie loads cowrie.cfg.dist itself internally from the package --
# this file contains ONLY what we change. Full list of every possible
# setting: https://github.com/cowrie/cowrie/blob/main/src/cowrie/data/etc/cowrie.cfg.dist
#
# WARNING: this must be a pure ASCII file (comments included) --
# Cowrie reads it as `read_text(encoding="ascii")`, otherwise LOADING
# THE WHOLE FILE BREAKS and EVERY LOGIN starts failing (fail-closed).

[honeypot]
# Hostname shown in the fake shell (`hostname`, `uname -a`, the prompt).
# Change it to anything believable -- the generic "svr04" default only
# attracts the laziest scanners.
hostname = webprod03

# CRITICAL: never change this to "proxy" or "llm", which would hand
# commands off elsewhere. "shell" = full emulation, that's the
# security boundary of this entire deployment.
backend = shell

# Size limit for downloaded "malware" samples (Cowrie only downloads
# and stores the file, never runs it -- but cap the size anyway).
download_limit_size = 26214400

[shell]
# Custom filesystem, see docs/ANTI-DETECTION.md and
# scripts/build-fakefs.sh.
# WARNING: this belongs under [shell], not [honeypot] (easy mix-up).
# If the file doesn't exist yet (you haven't run `make fakefs`),
# Cowrie silently falls back to the bundled generic fs.pickle.
filesystem = etc/fs.pickle

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = false

# Optional: share data with SANS ISC DShield (anonymized). Requires
# its own additional outbound firewall exception, disabled by default.
# [output_dshield]
# enabled = false
# userid = <your DShield ID>
# auth_key = <your DShield auth key>
